name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint tool
        run: python -m pip install --disable-pip-version-check ruff

      - name: Compile
        run: python -m compileall -q plugin tests scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Ruff
        run: ruff check plugin tests scripts
