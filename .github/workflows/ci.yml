name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint tool
        run: python -m pip install --disable-pip-version-check ruff

      - name: Compile
        run: python -m compileall -q plugin tests scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Ruff
        run: ruff check plugin tests scripts

  visual-docs:
    name: Generate real UI and KiCad symbol previews
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad nightly, Tk and capture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-dev-nightly
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad-nightly python3.12-venv python3-tk python3-pil python3-pil.imagetk kicad-nightly-symbols xvfb xauth xdotool x11-utils openbox
          CLI="$(command -v kicad-cli-nightly || command -v kicad-cli || true)"
          if [[ -z "$CLI" ]]; then
            echo "::error::KiCad CLI was not installed"
            exit 1
          fi
          echo "KICAD_CLI=$CLI" >> "$GITHUB_ENV"
          "$CLI" version
          python3 -c 'import tkinter; from PIL import Image, ImageGrab, ImageTk; print("Tk/Pillow capture runtime=ready")'
          python3.12 -m venv --system-site-packages "${RUNNER_TEMP}/kicad-visual-venv"
          "${RUNNER_TEMP}/kicad-visual-venv/bin/python" -m pip install --disable-pip-version-check -r plugin/kicad-jlcpcb-interface/requirements.txt
          "${RUNNER_TEMP}/kicad-visual-venv/bin/python" -c 'import kipy; import tkinter; from PIL import Image, ImageGrab, ImageTk; print("kicad-python/Tk/Pillow capture runtime=ready")'

      - name: Test visual documentation asset provenance
        run: "${RUNNER_TEMP}/kicad-visual-venv/bin/python -m unittest discover -s tests -p test_visual_docs.py -v"

      - name: Generate browser screenshots and native symbol SVGs
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/kicad-jlcpcb-visual-docs
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          xvfb-run -a -s "-screen 0 1920x1500x24" bash -euo pipefail -c '
            openbox --sm-disable >/tmp/kicad-openbox.log 2>&1 &
            openbox_pid=$!
            trap "kill $openbox_pid 2>/dev/null || true" EXIT
            wm_ready=0
            for attempt in $(seq 1 100); do
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -Fq "_NET_SUPPORTING_WM_CHECK(WINDOW)"; then
                wm_ready=1
                break
              fi
              if ! kill -0 "$openbox_pid" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done
            if [[ "$wm_ready" != 1 ]]; then
              echo "::error::Openbox did not register as the X11 window manager"
              cat /tmp/kicad-openbox.log >&2 || true
              exit 1
            fi
            xprop -root _NET_SUPPORTING_WM_CHECK
            "$RUNNER_TEMP/kicad-visual-venv/bin/python" tests/capture_visual_docs.py --output-dir "$OUTPUT_DIR"
          '

      - name: Upload generated visual documentation bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kicad-jlcpcb-visual-docs
          path: ${{ runner.temp }}/kicad-jlcpcb-visual-docs
          if-no-files-found: ignore
          compression-level: 1

  publish-visual-docs:
    name: Publish verified previews for main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [visual-docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    concurrency:
      group: kicad-jlcpcb-visual-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download generated preview bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kicad-jlcpcb-visual-docs
          path: ${{ runner.temp }}/kicad-jlcpcb-visual-docs

      - name: Publish hash-verified previews to docs/previews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_DIR: ${{ runner.temp }}/kicad-jlcpcb-visual-docs
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/publish_visual_docs.py \
            --source-dir "$SOURCE_DIR" \
            --repository "$REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" \
            --run-number "$RUN_NUMBER"
